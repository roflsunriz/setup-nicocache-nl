site_name: NicoCache_nl Usage Guide
site_description: NicoCache_nl のインストール・設定・使い方ガイド
site_author: roflsunriz
site_url: https://roflsunriz.github.io/setup-nicocache-nl/

repo_url: https://github.com/roflsunriz/setup-nicocache-nl
repo_name: roflsunriz/setup-nicocache-nl

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - git-revision-date-localized:
      type: custom
      custom_format: "%Y/%m/%d"
      timezone: Asia/Tokyo
      fallback_to_build_date: false
      strict: true
      enabled: !ENV [ENABLED_GIT_DATES, true]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - ホーム: index.md
  - ダウンロード: download.md
  - インストール:
    - 通常インストール(Win): install-win.md
    - 通常インストール(Linux): install-linux.md
    - 通常インストール(Mac): install-mac.md
    - 通常インストール(Solaris): install-solaris.md
    - 簡単インストーラー(Win): fast-installer-win.md
  - アップデート: 
    - NicoCache_nl: update.md
    - 依存関係ソフトウェア: update-dependencies.md
  - nlFilters:
    - 概要: nl-filters.md
    - 構文リファレンス: nl-filters-syntax.md
    - 正規表現: regex.md
  - 拡張機能: extensions.md
  - トラブルシューティング: trouble-shooting.md
  - サポートサイト: support-site.md
